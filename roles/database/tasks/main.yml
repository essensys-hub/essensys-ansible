---
- name: Ensure PostgreSQL service is started
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Create essensys database user
  postgresql_user:
    name: "{{ portal_db_user | default('essensys') }}"
    password: "{{ portal_db_password }}"
    role_attr_flags: NOSUPERUSER
  become: yes
  become_user: postgres

- name: Create essensys database
  postgresql_db:
    name: "{{ portal_db_name | default('essensys_db') }}"
    owner: "{{ portal_db_user | default('essensys') }}"
  become: yes
  become_user: postgres
