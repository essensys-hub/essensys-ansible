---
# --- Migration depuis l'ancien Mosquitto (docker-compose + systemd) ---
- name: Arreter l'ancien service systemd Mosquitto
  systemd:
    name: mosquitto
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: Arreter l'ancien conteneur mosquitto
  community.docker.docker_container:
    name: mosquitto
    state: absent
  failed_when: false

- name: Supprimer l'ancien service systemd Mosquitto
  file:
    path: /etc/systemd/system/mosquitto.service
    state: absent

# --- Config dans /opt/data/config/mosquitto ---
- name: Creer les repertoires Mosquitto
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0777'
  loop:
    - "{{ mosquitto_config_dir }}"
    - "{{ mosquitto_data_dir }}"
    - "{{ mosquitto_log_dir }}"

- name: Deployer mosquitto.conf
  template:
    src: mosquitto.conf.j2
    dest: "{{ mosquitto_config_dir }}/mosquitto.conf"
    mode: '0644'

- name: Migrer le fichier password depuis l'ancien emplacement
  copy:
    src: "{{ mosquitto_legacy_dir }}/config/passwd"
    dest: "{{ mosquitto_config_dir }}/passwd"
    remote_src: true
    mode: '0644'
    force: false
  failed_when: false

- name: Verifier si le fichier password existe
  stat:
    path: "{{ mosquitto_config_dir }}/passwd"
  register: mqtt_passwd_stat

- name: Generer le fichier password Mosquitto si absent
  shell: |
    docker run --rm --user 0:0 -v {{ mosquitto_config_dir }}:/mosquitto/config \
      {{ mosquitto_image }}:{{ mosquitto_version }} \
      sh -c "mosquitto_passwd -c -b /mosquitto/config/passwd {{ mosquitto_user }} {{ mosquitto_password }}"
  when: not mqtt_passwd_stat.stat.exists

- name: Fixer les permissions du fichier password (0644 — lisible par le conteneur)
  file:
    path: "{{ mosquitto_config_dir }}/passwd"
    mode: '0644'
    owner: root
    group: root

- name: Migrer les donnees depuis l'ancien emplacement
  shell: |
    if [ -d "{{ mosquitto_legacy_dir }}/data" ] && [ -n "$(ls -A {{ mosquitto_legacy_dir }}/data 2>/dev/null)" ]; then
      cp -n {{ mosquitto_legacy_dir }}/data/* {{ mosquitto_data_dir }}/ 2>/dev/null || true
    fi
  changed_when: false
