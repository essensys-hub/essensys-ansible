---
# --- Liberer le port 53 (requis pour AdGuard DNS) ---

- name: Verifier resolved.conf
  stat:
    path: /etc/systemd/resolved.conf
  register: resolved_conf

- name: Desactiver DNSStubListener pour systemd-resolved
  lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
  notify: Restart resolved
  when: resolved_conf.stat.exists

- name: Verifier resolv.conf source
  stat:
    path: /run/systemd/resolve/resolv.conf
  register: resolv_source

- name: Verifier resolv.conf
  file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
  when: resolv_source.stat.exists

# --- Migration depuis l'ancienne installation binaire ---

- name: Verifier si AdGuard Home binaire existe
  stat:
    path: /opt/AdGuardHome/AdGuardHome
  register: adguard_binary

- name: Arreter le service systemd AdGuard Home (migration)
  service:
    name: AdGuardHome
    state: stopped
    enabled: false
  when: adguard_binary.stat.exists
  failed_when: false

- name: Desinstaller le service systemd AdGuard Home
  command: /opt/AdGuardHome/AdGuardHome -s uninstall
  args:
    chdir: /opt/AdGuardHome
  when: adguard_binary.stat.exists
  failed_when: false

# --- Preparation des repertoires pour le conteneur Docker ---

- name: Retrieve eth0 gateway for AdGuard upstream DNS
  shell: ip -4 route show default dev eth0 | awk '{print $3}' | head -1
  register: eth0_gateway
  changed_when: false
  failed_when: false

- name: Retrieve eth0 IP address
  shell: ip -4 addr show eth0 | awk '/inet / {print $2}' | cut -d/ -f1 | head -1
  register: eth0_ip_detected
  changed_when: false
  failed_when: false
  when: gateway_dual_nic | default(false) | bool

- name: Definir gateway_eth0_ip depuis l'interface si non defini
  set_fact:
    gateway_eth0_ip: "{{ eth0_ip_detected.stdout | default(ansible_default_ipv4.address, true) }}"
  when:
    - gateway_dual_nic | default(false) | bool
    - gateway_eth0_ip | default('') == ''

- name: Creer le repertoire de configuration AdGuard
  file:
    path: "{{ adguard_config_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Creer le repertoire de donnees AdGuard
  file:
    path: "{{ adguard_data_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Migrer la configuration existante vers le nouveau repertoire
  copy:
    src: /opt/AdGuardHome/AdGuardHome.yaml
    dest: "{{ adguard_config_dir }}/AdGuardHome.yaml"
    remote_src: true
    force: false
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  when: adguard_binary.stat.exists
  failed_when: false

- name: Verifier configuration AdGuard existante
  stat:
    path: "{{ adguard_config_dir }}/AdGuardHome.yaml"
  register: adguard_config_stat

- name: Deployer la configuration AdGuard Home (install initiale uniquement)
  template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_config_dir }}/AdGuardHome.yaml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
    force: true
  when: not adguard_config_stat.stat.exists
  notify: Restart adguard container
  tags: [adguard, lan-dns]

# --- Profil gateway : bloquer l'acces au web UI AdGuard depuis eth1 ---

- name: AdGuard - installer iptables-persistent pour le profil gateway
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  when: gateway_dual_nic | default(false) | bool

- name: AdGuard - bloquer acces web UI depuis le segment armoire (eth1)
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: eth1
    protocol: tcp
    destination_port: "{{ adguard_web_port }}"
    jump: DROP
    comment: "Block AdGuard UI from armoire segment"
  when: gateway_dual_nic | default(false) | bool
  notify: Save iptables rules
