---
# --- Liberer le port 53 (requis pour AdGuard DNS) ---

- name: Verifier resolved.conf
  stat:
    path: /etc/systemd/resolved.conf
  register: resolved_conf

- name: Desactiver DNSStubListener pour systemd-resolved
  lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
  notify: Restart resolved
  when: resolved_conf.stat.exists

- name: Verifier resolv.conf source
  stat:
    path: /run/systemd/resolve/resolv.conf
  register: resolv_source

- name: Verifier resolv.conf
  file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
  when: resolv_source.stat.exists

# --- Migration depuis l'ancienne installation binaire ---

- name: Verifier si AdGuard Home binaire existe
  stat:
    path: /opt/AdGuardHome/AdGuardHome
  register: adguard_binary

- name: Arreter le service systemd AdGuard Home (migration)
  service:
    name: AdGuardHome
    state: stopped
    enabled: false
  when: adguard_binary.stat.exists
  failed_when: false

- name: Desinstaller le service systemd AdGuard Home
  command: /opt/AdGuardHome/AdGuardHome -s uninstall
  args:
    chdir: /opt/AdGuardHome
  when: adguard_binary.stat.exists
  failed_when: false

# --- Preparation des repertoires pour le conteneur Docker ---

- name: Creer le repertoire de configuration AdGuard
  file:
    path: "{{ adguard_config_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Creer le repertoire de donnees AdGuard
  file:
    path: "{{ adguard_data_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Migrer la configuration existante vers le nouveau repertoire
  copy:
    src: /opt/AdGuardHome/AdGuardHome.yaml
    dest: "{{ adguard_config_dir }}/AdGuardHome.yaml"
    remote_src: true
    force: false
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  when: adguard_binary.stat.exists
  failed_when: false

- name: Deployer la configuration AdGuard Home (si pas de config existante)
  template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_config_dir }}/AdGuardHome.yaml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
    force: false
