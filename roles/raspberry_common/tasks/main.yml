---
- name: Mettre a jour le cache APT
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les dependances systeme
  apt:
    name:
      - curl
      - wget
      - git
      - python3
      - python3-yaml
      - ca-certificates
      - openssh-client
      - apache2-utils
      - openssl
    state: present

- name: Creer l'utilisateur de service
  user:
    name: "{{ service_user }}"
    shell: /bin/bash
    create_home: true
    home: "/home/{{ service_user }}"

- name: Creer la structure /opt/data/
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'
  loop:
    - "{{ data_dir }}"
    - "{{ config_dir }}"
    - "{{ config_dir }}/backend"
    - "{{ config_dir }}/mcp"
    - "{{ config_dir }}/control-plane"
    - "{{ config_dir }}/nginx"
    - "{{ config_dir }}/traefik"
    - "{{ config_dir }}/traefik/dynamic"
    - "{{ data_dir }}/control-plane"
    - "{{ config_dir }}/redis"
    - "{{ data_dir }}/redis"
    - "{{ data_dir }}/frontend"
    - "{{ data_dir }}/logs"

- name: Lire le domaine WAN
  slurp:
    src: "{{ domain_file }}"
  register: domain_file_content
  ignore_errors: true

- name: Calculer le domaine WAN
  set_fact:
    wan_domain: >-
      {{
        (domain_file_content.content | default('') | b64decode | trim)
        if (domain_file_content is defined and domain_file_content.content is defined and (domain_file_content.content | b64decode | trim) != '')
        else wan_domain_default
      }}
