---
openclaw_image: "coollabsio/openclaw"
openclaw_version: "latest"
openclaw_container_name: "essensys-openclaw"
openclaw_port: 18789

openclaw_config_dir: "{{ config_dir }}/openclaw"
openclaw_data_dir: "{{ data_dir }}/openclaw"

openclaw_gateway_token_file: "{{ openclaw_config_dir }}/gateway.token"
openclaw_hooks_token_file: "{{ openclaw_config_dir }}/hooks.token"

openclaw_model: "openai/gpt-4o-mini"
