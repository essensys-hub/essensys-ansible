---
- name: restart nginx
  community.docker.docker_container:
    name: "{{ nginx_container_name }}"
    image: "{{ nginx_image }}:{{ nginx_version }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "{{ nginx_config_dir }}/default.conf:/etc/nginx/http.d/default.conf:ro"
      - "{{ nginx_frontend_dir }}:/var/www/html:ro"
