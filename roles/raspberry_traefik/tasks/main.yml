---
- name: Arreter l'ancien Traefik systemd (migration vers Docker)
  service:
    name: traefik
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: Arreter l'ancien service block (migration)
  service:
    name: traefik-block-service
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: Supprimer les anciens services systemd Traefik
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/traefik.service
    - /etc/systemd/system/traefik-block-service.service

- name: Creer les repertoires Traefik
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_config_dir }}/dynamic"
    - "{{ traefik_log_dir }}"

- name: Deployer la configuration Traefik
  template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  notify: restart traefik

- name: Deployer les routes WAN
  template:
    src: wan-routes.yml.j2
    dest: "{{ traefik_config_dir }}/dynamic/wan-routes.yml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  notify: restart traefik

- name: Creer acme.json si absent
  file:
    path: "{{ traefik_config_dir }}/acme.json"
    state: touch
    mode: '0600'
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    modification_time: preserve
    access_time: preserve

- name: Creer users.htpasswd si absent
  file:
    path: "{{ traefik_config_dir }}/users.htpasswd"
    state: touch
    mode: '0600'
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    modification_time: preserve
    access_time: preserve

- name: Installer generate-htpasswd.sh
  copy:
    src: generate-htpasswd.sh
    dest: /usr/local/bin/generate-htpasswd-essensys.sh
    mode: '0755'

- name: Pull de l'image Traefik
  community.docker.docker_image:
    name: "{{ traefik_image }}:{{ traefik_version_docker }}"
    source: pull
    force_source: true
  register: traefik_pull_result
  notify: restart traefik

- name: Lancer le conteneur Traefik
  community.docker.docker_container:
    name: "{{ traefik_container_name }}"
    image: "{{ traefik_image }}:{{ traefik_version_docker }}"
    state: started
    recreate: "{{ traefik_pull_result is changed }}"
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "{{ traefik_config_dir }}:/etc/traefik"
      - "{{ traefik_log_dir }}:/var/log/traefik"

- name: Afficher le statut Traefik
  debug:
    msg: "Traefik {{ traefik_version_docker }} deploye (HTTPS:443, dashboard:8080)"
