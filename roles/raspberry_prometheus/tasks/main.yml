---
- name: Creer le repertoire de configuration Prometheus
  file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Creer le repertoire de donnees Prometheus
  file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "65534"
    group: "65534"
    mode: '0755'

- name: Creer le repertoire des regles d'alertes
  file:
    path: "{{ prometheus_config_dir }}/rules"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Deployer la configuration Prometheus
  template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'

- name: Deployer les regles d'alertes
  template:
    src: alert_rules.yml.j2
    dest: "{{ prometheus_config_dir }}/rules/alert_rules.yml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'

# --- Charger le token hooks OpenClaw pour Alertmanager ---
- name: Verifier si le token hooks OpenClaw existe
  stat:
    path: "{{ config_dir }}/openclaw/hooks.token"
  register: prometheus_openclaw_hooks_stat

- name: Lire le token hooks OpenClaw
  slurp:
    src: "{{ config_dir }}/openclaw/hooks.token"
  register: prometheus_openclaw_hooks_b64
  when: prometheus_openclaw_hooks_stat.stat.exists

- name: Definir le token hooks OpenClaw pour Alertmanager
  set_fact:
    openclaw_hooks_token: "{{ prometheus_openclaw_hooks_b64['content'] | b64decode | trim }}"
  when: prometheus_openclaw_hooks_stat.stat.exists

- name: Definir un token hooks placeholder si absent
  set_fact:
    openclaw_hooks_token: "NOT_YET_CONFIGURED"
  when: not prometheus_openclaw_hooks_stat.stat.exists

- name: Definir le port OpenClaw par defaut
  set_fact:
    openclaw_port: 18789
  when: openclaw_port is not defined

- name: Deployer la configuration Alertmanager
  template:
    src: alertmanager.yml.j2
    dest: "{{ prometheus_config_dir }}/alertmanager.yml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
