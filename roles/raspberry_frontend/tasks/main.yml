---
- name: Pull de l'image frontend
  community.docker.docker_image:
    name: "{{ frontend_image }}:{{ frontend_version }}"
    source: pull
    force_source: true

- name: Extraire les fichiers statiques du frontend
  shell: |
    docker rm -f essensys-frontend-extract 2>/dev/null || true
    docker create --name essensys-frontend-extract {{ frontend_image }}:{{ frontend_version }}
    docker cp essensys-frontend-extract:/var/www/html/. {{ frontend_html_dir }}/
    docker rm essensys-frontend-extract
  changed_when: true

- name: Fixer les permissions des fichiers frontend
  file:
    path: "{{ frontend_html_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    recurse: true

- name: Afficher le statut frontend
  debug:
    msg: "Frontend {{ frontend_version }} deploye dans {{ frontend_html_dir }}"
