---
- name: Pull de l'image frontend
  community.docker.docker_image:
    name: "{{ frontend_image }}:{{ frontend_version }}"
    source: pull
    force_source: true
  notify: restart frontend

- name: Lancer le conteneur frontend
  community.docker.docker_container:
    name: "{{ frontend_container_name }}"
    image: "{{ frontend_image }}:{{ frontend_version }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    comparisons:
      image: strict

- name: Verifier que le frontend repond
  uri:
    url: "http://localhost:{{ frontend_port }}/"
    status_code: [200]
  register: frontend_health
  retries: 5
  delay: 3
  until: frontend_health.status == 200
  ignore_errors: true

- name: Afficher le statut frontend
  debug:
    msg: "Frontend {{ frontend_version }} deploye sur le port {{ frontend_port }}"
