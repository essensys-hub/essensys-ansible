---
- name: Arreter le Redis systeme (migration vers Docker)
  service:
    name: redis-server
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: Creer les repertoires Redis
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'
  loop:
    - "{{ redis_config_dir }}"
    - "{{ redis_data_dir }}"

- name: Deployer la config Redis si absente
  copy:
    dest: "{{ redis_config_dir }}/redis.conf"
    content: |
      bind 0.0.0.0
      port {{ redis_port }}
      protected-mode no
      dir /data
      dbfilename dump.rdb
      save 900 1
      save 300 10
      save 60 10000
      maxmemory 128mb
      maxmemory-policy allkeys-lru
      loglevel notice
      logfile ""
      tcp-backlog 128
      tcp-keepalive 300
      timeout 0
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
    force: false
