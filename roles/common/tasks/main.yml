---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install system dependencies
  apt:
    name:
      - git
      - nginx
      - curl
      - postgresql
      - postgresql-contrib
      - acl
      - python3-psycopg2
      - certbot
      - python3-certbot-nginx
    state: present

- name: Check if Go is installed
  command: /usr/local/go/bin/go version
  register: go_installed
  ignore_errors: yes
  changed_when: false

- name: Download Go
  shell: curl -fsSL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz -o /tmp/go1.23.4.linux-amd64.tar.gz
  args:
    creates: /tmp/go1.23.4.linux-amd64.tar.gz
  when: go_installed.rc != 0

- name: Install Go
  unarchive:
    src: /tmp/go1.23.4.linux-amd64.tar.gz
    dest: /usr/local
    remote_src: yes
  when: go_installed.rc != 0

- name: Add Go to path
  lineinfile:
    path: /root/.bashrc
    line: 'export PATH=$PATH:/usr/local/go/bin'
    state: present

- name: Download Node.js setup script
  shell: curl -fsSL https://deb.nodesource.com/setup_20.x -o /tmp/nodesource_setup.sh
  args:
    creates: /tmp/nodesource_setup.sh

- name: Run Node.js setup
  shell: bash /tmp/nodesource_setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js
  apt:
    name: nodejs
    state: present

- name: Create essensys system user
  user:
    name: essensys
    system: yes
    shell: /bin/false

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: essensys
    group: essensys
    mode: '0755'
  loop:
    - /opt/essensys/backend
    - /opt/essensys/frontend/dist
    - /opt/essensys/maintenance
