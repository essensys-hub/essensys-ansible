---
- name: Verifier si le token MCP existe
  stat:
    path: "{{ mcp_token_file }}"
  register: mcp_token_stat

- name: Generer un token MCP aleatoire
  shell: openssl rand -hex 32 > {{ mcp_token_file }}
  args:
    creates: "{{ mcp_token_file }}"
  when: not mcp_token_stat.stat.exists

- name: Fixer les permissions du token
  file:
    path: "{{ mcp_token_file }}"
    mode: '0600'
    owner: "{{ service_user }}"
    group: "{{ service_user }}"

- name: Lire le token MCP
  slurp:
    src: "{{ mcp_token_file }}"
  register: mcp_token_b64

- name: Definir variable token
  set_fact:
    mcp_token: "{{ mcp_token_b64['content'] | b64decode | trim }}"

- name: Arreter l'ancien service systemd MCP (migration)
  service:
    name: essensys-mcp
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: Supprimer l'ancien service systemd MCP
  file:
    path: /etc/systemd/system/essensys-mcp.service
    state: absent

- name: Arreter tout processus essensys-mcp existant
  command: pkill -f essensys-mcp
  changed_when: false
  failed_when: false

- name: Pull de l'image MCP
  community.docker.docker_image:
    name: "{{ mcp_image }}:{{ mcp_version }}"
    source: pull
    force_source: true
  register: mcp_pull_result
  notify: restart mcp

- name: Lancer le conteneur MCP
  community.docker.docker_container:
    name: "{{ mcp_container_name }}"
    image: "{{ mcp_image }}:{{ mcp_version }}"
    state: started
    recreate: "{{ mcp_pull_result is changed }}"
    restart_policy: unless-stopped
    network_mode: host
    entrypoint: ["mcp-server"]
    command: ["-mode", "sse", "-port", "{{ mcp_port }}", "-token", "{{ mcp_token }}"]

- name: Afficher le statut MCP
  debug:
    msg: "MCP {{ mcp_version }} deploye sur le port {{ mcp_port }}"
