---
- name: Clone user portal frontend repository
  git:
    repo: "{{ portal_frontend_repo }}"
    dest: /opt/essensys/portal-frontend-src
    version: "{{ portal_frontend_version | default('main') }}"
    force: yes

- name: Install npm dependencies
  command: npm install
  args:
    chdir: /opt/essensys/portal-frontend-src

- name: Build portal frontend
  command: npm run build
  args:
    chdir: /opt/essensys/portal-frontend-src
  environment:
    VITE_NEW_RELIC_ENABLED: "{{ newrelic_browser_enabled | default(false) | bool | lower }}"
    VITE_NEW_RELIC_ACCOUNT_ID: "{{ newrelic_account_id | default('') }}"
    VITE_NEW_RELIC_APPLICATION_ID: "{{ newrelic_browser_application_id | default('') }}"
    VITE_NEW_RELIC_LICENSE_KEY: "{{ vault_newrelic_browser_license_key | default(vault_newrelic_license_key | default('')) }}"
    VITE_NEW_RELIC_AGENT_ID: "{{ newrelic_browser_agent_id | default('') }}"
    VITE_NEW_RELIC_TRUST_KEY: "{{ newrelic_browser_trust_key | default(newrelic_account_id | default('')) }}"
    VITE_NEW_RELIC_REGION: "{{ newrelic_region | default('EU') }}"

- name: Deploy portal frontend dist
  file:
    path: /opt/essensys/portal-frontend/dist
    state: absent

- name: Recreate portal frontend dist directory
  file:
    path: /opt/essensys/portal-frontend/dist
    state: directory
    owner: essensys
    group: essensys
    mode: '0755'

- name: Copy portal frontend artifacts
  copy:
    src: /opt/essensys/portal-frontend-src/dist/
    dest: /opt/essensys/portal-frontend/dist/
    remote_src: yes
    owner: essensys
    group: essensys
