---
# Peripherique NVMe cible (CM5 PCIe)
gateway_nvme_device: "/dev/nvme0n1"

data_dir: /opt/data

# true : monter le NVMe directement sur {{ data_dir }} (recommande gateway CM5)
# false : monter sur /mnt/nvme + bind mounts (legacy)
gateway_nvme_direct_data_mount: true

# Point de montage NVMe en mode legacy (bind mounts)
essensys_nvme_mount_legacy: "/mnt/nvme"

# Activer les bind mounts supplementaires (logs en mode direct, data+logs en legacy)
gateway_nvme_bind_mounts_enabled: true
