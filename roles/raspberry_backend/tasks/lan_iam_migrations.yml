---
- name: Verifier mot de passe PostgreSQL pour migrations
  ansible.builtin.stat:
    path: "{{ gateway_db_password_file | default(config_dir + '/backend/.postgres_password') }}"
  register: gateway_db_pw_stat

- name: Verifier existence table lan_users
  ansible.builtin.shell: |
    set -euo pipefail
    export PGPASSWORD="$(cat '{{ gateway_db_password_file | default(config_dir + '/backend/.postgres_password') }}')"
    psql -h "{{ gateway_db_host | default('127.0.0.1') }}" \
         -U "{{ gateway_db_user | default('essensys') }}" \
         -d "{{ gateway_db_name | default('essensys_db') }}" \
         -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='lan_users'"
  register: lan_users_table_check
  changed_when: false
  failed_when: false
  when:
    - lan_iam_enabled | default(false) | bool
    - gateway_db_pw_stat.stat.exists

- name: Appliquer migration lan_users (003)
  ansible.builtin.shell: |
    set -euo pipefail
    export PGPASSWORD="$(cat '{{ gateway_db_password_file | default(config_dir + '/backend/.postgres_password') }}')"
    psql -h "{{ gateway_db_host | default('127.0.0.1') }}" \
         -U "{{ gateway_db_user | default('essensys') }}" \
         -d "{{ gateway_db_name | default('essensys_db') }}" \
         -v ON_ERROR_STOP=1 \
         -f "{{ backend_dir }}/migrations/003_lan_users.up.sql"
  become_user: "{{ service_user }}"
  when:
    - lan_iam_enabled | default(false) | bool
    - gateway_db_pw_stat.stat.exists
    - lan_users_table_check.stdout | default('') | trim != '1'
