
---
- name: Definir variables backend
  set_fact:
    backend_repo_dir: "/home/{{ service_user }}/essensys-server-backend"

- name: Dedoublonner config backend avant blocs Ansible
  import_tasks: dedupe_config.yml

- name: Cloner ou mettre a jour le backend
  git:
    repo: "{{ backend_repo }}"
    dest: "{{ backend_repo_dir }}"
    version: "{{ backend_version }}"
    force: true
  become_user: "{{ service_user }}"

- name: Arreter le service backend avant mise a jour
  service:
    name: essensys-backend
    state: stopped
  failed_when: false
  changed_when: false
  when: backend_runtime == 'systemd'

- name: Copier le backend vers le repertoire d'installation
  command: rsync -a --delete "{{ backend_repo_dir }}/" "{{ backend_dir }}/"
  register: backend_sync
  changed_when: backend_sync.rc == 0

- name: Synchroniser les dependances Go
  command: /usr/local/go/bin/go mod tidy
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
  register: go_mod_tidy
  failed_when: false
  changed_when: go_mod_tidy.rc == 0

- name: Telecharger les dependances Go si necessaire
  command: /usr/local/go/bin/go mod download
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
  when: go_mod_tidy.rc != 0

- name: Reexecuter go mod tidy apres download
  command: /usr/local/go/bin/go mod tidy
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
  when: go_mod_tidy.rc != 0

- name: Compiler le backend (binaire statique pour conteneur Alpine)
  command: /usr/local/go/bin/go build -o server ./cmd/server
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
    CGO_ENABLED: "0"

- name: Creer le fichier config.yaml si absent
  copy:
    dest: "{{ backend_config }}"
    content: |
      server:
        port: 7070
        read_timeout: 10s
        write_timeout: 10s
        idle_timeout: 60s

      auth:
        enabled: false
        clients:
          testclient: testpass

        logging:
        level: info
        format: text

      redis:
        addr: "localhost:6379"
        password: ""
        db: 0

      unifi:
        enabled: false
        base_url: "https://192.168.0.1"
        api_key: ""
        username: ""
        password: ""
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
    force: false

- name: Forcer le port 7070 dans config.yaml (section server uniquement)
  ansible.builtin.replace:
    path: "{{ backend_config }}"
    after: '^server:'
    before: '^auth:'
    regexp: '^\s*port:\s*.*$'
    replace: '  port: 7070'

- name: Configure cloud sync scheduler (gateway)
  import_tasks: cloud_sync.yml

- name: Configurer IAM LAN (017)
  import_tasks: lan_iam.yml

- name: Appliquer migrations SQL LAN IAM
  import_tasks: lan_iam_migrations.yml

- name: Configurer UniFi Protect dans config.yaml
  blockinfile:
    path: "{{ backend_config }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK UNIFI"
    block: |
      unifi:
        enabled: {{ unifi_enabled | lower }}
        base_url: "{{ unifi_base_url }}"
        api_key: "{{ unifi_api_key }}"
        {% if unifi_username | default('') != '' %}
        username: "{{ unifi_username }}"
        {% endif %}
        {% if unifi_password | default('') != '' %}
        password: "{{ unifi_password }}"
        {% endif %}
    create: yes
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'

- name: Creer le repertoire de logs backend
  file:
    path: /var/log/essensys
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Installer le service systemd du backend
  template:
    src: essensys-backend.service.j2
    dest: /etc/systemd/system/essensys-backend.service
    mode: '0644'
  when: backend_runtime == 'systemd'

- name: Recharger systemd
  systemd:
    daemon_reload: true
  when: backend_runtime == 'systemd'

- name: Definir les permissions du backend
  file:
    path: "{{ backend_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    recurse: true

- name: Demarrer le service backend
  service:
    name: essensys-backend
    state: restarted
    enabled: true
  when: backend_runtime == 'systemd'

- name: Dedoublonner config backend apres injection des blocs
  import_tasks: dedupe_config.yml

- name: Redemarrer backend si config dedoublonnee
  service:
    name: essensys-backend
    state: restarted
  when: dedupe_config is defined and dedupe_config.changed | default(false)
        and backend_runtime == 'systemd'

- name: S'assurer que Redis est actif (Docker, ignore si absent en systemd)
  service:
    name: redis-server
    state: started
    enabled: true
  failed_when: false
