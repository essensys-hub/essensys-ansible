---
- name: Creer le repertoire de donnees backend
  file:
    path: "{{ backend_data_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Verifier si la config backend existe
  stat:
    path: "{{ backend_config }}"
  register: backend_config_stat

- name: Deployer la configuration backend
  template:
    src: config.yaml.j2
    dest: "{{ backend_config }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  when: not backend_config_stat.stat.exists
  notify: restart backend

- name: Pull de l'image backend
  community.docker.docker_image:
    name: "{{ backend_image }}:{{ backend_version }}"
    source: pull
    force_source: true
  notify: restart backend

- name: Arreter l'ancien service systemd backend (migration)
  service:
    name: essensys-backend
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: Supprimer l'ancien service systemd backend
  file:
    path: /etc/systemd/system/essensys-backend.service
    state: absent
  notify: reload systemd

- name: Lancer le conteneur backend
  community.docker.docker_container:
    name: "{{ backend_container_name }}"
    image: "{{ backend_image }}:{{ backend_version }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    entrypoint: ["server"]
    command: ["-config", "/etc/essensys/config.yaml"]
    volumes:
      - "{{ backend_config }}:/etc/essensys/config.yaml:ro"
      - "{{ backend_data_dir }}:/data"
    comparisons:
      image: strict

- name: Verifier que le backend repond
  uri:
    url: "http://localhost:{{ backend_port }}/api/health"
    status_code: [200, 404]
  register: backend_health
  retries: 5
  delay: 3
  until: backend_health.status is defined
  ignore_errors: true

- name: Afficher le statut backend
  debug:
    msg: "Backend {{ backend_version }} deploye sur le port {{ backend_port }}"
