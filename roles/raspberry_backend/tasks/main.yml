
---
- name: Definir variables backend
  set_fact:
    backend_repo_dir: "/home/{{ service_user }}/essensys-server-backend"

- name: Cloner ou mettre a jour le backend
  git:
    repo: "{{ backend_repo }}"
    dest: "{{ backend_repo_dir }}"
    version: "{{ backend_version }}"
    force: true
  become_user: "{{ service_user }}"

- name: Arreter le service backend avant mise a jour
  service:
    name: essensys-backend
    state: stopped
  failed_when: false
  changed_when: false

- name: Copier le backend vers le repertoire d'installation
  command: rsync -a --delete "{{ backend_repo_dir }}/" "{{ backend_dir }}/"
  register: backend_sync
  changed_when: backend_sync.rc == 0

- name: Synchroniser les dependances Go
  command: /usr/local/go/bin/go mod tidy
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
  register: go_mod_tidy
  failed_when: false
  changed_when: go_mod_tidy.rc == 0

- name: Telecharger les dependances Go si necessaire
  command: /usr/local/go/bin/go mod download
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
  when: go_mod_tidy.rc != 0

- name: Reexecuter go mod tidy apres download
  command: /usr/local/go/bin/go mod tidy
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local
  when: go_mod_tidy.rc != 0

- name: Compiler le backend
  command: /usr/local/go/bin/go build -o server ./cmd/server
  args:
    chdir: "{{ backend_dir }}"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
    GOTOOLCHAIN: local

- name: Creer le fichier config.yaml si absent
  copy:
    dest: "{{ backend_dir }}/config.yaml"
    content: |
      server:
        port: 7070
        read_timeout: 10s
        write_timeout: 10s
        idle_timeout: 60s

      auth:
        enabled: false
        clients:
          testclient: testpass

        logging:
        level: info
        format: text

      redis:
        addr: "localhost:6379"
        password: ""
        db: 0

      unifi:
        enabled: false
        base_url: "https://192.168.0.1"
        api_key: ""
        username: ""
        password: ""
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
    force: false

- name: Forcer le port 7070 dans config.yaml
  lineinfile:
    path: "{{ backend_dir }}/config.yaml"
    regexp: '^\s*port:'
    line: '  port: 7070'
    insertafter: '^server:'

- name: Configure cloud sync scheduler (gateway)
  import_tasks: cloud_sync.yml

- name: Configurer UniFi Protect dans config.yaml
  blockinfile:
    path: "{{ backend_dir }}/config.yaml"
    marker: "# {mark} ANSIBLE MANAGED BLOCK UNIFI"
    block: |
      unifi:
        enabled: {{ unifi_enabled | lower }}
        base_url: "{{ unifi_base_url }}"
        api_key: "{{ unifi_api_key }}"
        {% if unifi_username | default('') != '' %}
        username: "{{ unifi_username }}"
        {% endif %}
        {% if unifi_password | default('') != '' %}
        password: "{{ unifi_password }}"
        {% endif %}
    create: yes
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'

- name: Creer le repertoire de logs backend
  file:
    path: /var/log/essensys
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Installer le service systemd du backend
  template:
    src: essensys-backend.service.j2
    dest: /etc/systemd/system/essensys-backend.service
    mode: '0644'

- name: Recharger systemd
  systemd:
    daemon_reload: true

- name: Definir les permissions du backend
  file:
    path: "{{ backend_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    recurse: true

- name: Demarrer le service backend
  service:
    name: essensys-backend
    state: restarted
    enabled: true

- name: S'assurer que Redis est actif (Docker, ignore si absent en systemd)
  service:
    name: redis-server
    state: started
    enabled: true
  failed_when: false
