---
- name: restart backend
  community.docker.docker_container:
    name: "{{ backend_container_name }}"
    image: "{{ backend_image }}:{{ backend_version }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    network_mode: host
    entrypoint: ["server"]
    command: ["-config", "/etc/essensys/config.yaml"]
    volumes:
      - "{{ backend_config }}:/etc/essensys/config.yaml:ro"

- name: reload systemd
  systemd:
    daemon_reload: true
