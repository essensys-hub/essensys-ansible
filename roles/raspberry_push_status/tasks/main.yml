---
- name: Copier le script de push status
  copy:
    src: push_status.py
    dest: "{{ data_dir }}/push_status.py"
    mode: '0755'

- name: Installer le service systemd de push status
  template:
    src: essensys-push.service.j2
    dest: /etc/systemd/system/essensys-push.service
    mode: '0644'

- name: Installer le timer systemd de push status
  template:
    src: essensys-push.timer.j2
    dest: /etc/systemd/system/essensys-push.timer
    mode: '0644'

- name: Recharger systemd
  systemd:
    daemon_reload: true

- name: Activer le timer push status
  service:
    name: essensys-push.timer
    state: started
    enabled: true
