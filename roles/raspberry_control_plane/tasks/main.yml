---
- name: Verifier si la config Control Plane existe
  stat:
    path: "{{ control_plane_config }}"
  register: cp_config_stat

- name: Generer un token d'authentification
  command: openssl rand -hex 32
  register: cp_auth_token
  when: not cp_config_stat.stat.exists
  changed_when: false

- name: Lire le token existant depuis la config
  shell: "grep auth_token {{ control_plane_config }} | sed 's/.*\"\\(.*\\)\"/\\1/'"
  register: cp_existing_token
  when: cp_config_stat.stat.exists
  changed_when: false

- name: Definir le token d'authentification
  set_fact:
    control_plane_auth_token: "{{ cp_auth_token.stdout if not cp_config_stat.stat.exists else cp_existing_token.stdout }}"

- name: Deployer la configuration du Control Plane
  template:
    src: config.yaml.j2
    dest: "{{ control_plane_config }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0600'

- name: Creer le repertoire de donnees Control Plane
  file:
    path: "{{ control_plane_data }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'
