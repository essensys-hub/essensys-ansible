---
- name: Clone repository
  git:
    repo: 'https://github.com/essensys-hub/essensys-support-site.git'
    dest: /opt/essensys/repo
    version: V.1.0.0
    force: yes

- name: Clone essensys-memory for blog content
  git:
    repo: "{{ roadmap_site_memory_repo | default('https://github.com/essensys-hub/essensys-memory.git') }}"
    dest: /opt/essensys/blog-build/essensys-memory
    version: "{{ roadmap_site_memory_version | default('main') }}"
    force: yes
  when: prepare_blog_from_memory | default(false) | bool

- name: Ensure frontend helper directory
  file:
    path: /opt/essensys/frontend-files
    state: directory
    mode: '0755'
  when: prepare_blog_from_memory | default(false) | bool

- name: Copy blog prepare script
  copy:
    src: prepare_blog_from_memory.py
    dest: /opt/essensys/frontend-files/prepare_blog_from_memory.py
    mode: '0755'
  when: prepare_blog_from_memory | default(false) | bool

- name: Prepare blog static files for Vite build
  command: >
    python3 /opt/essensys/frontend-files/prepare_blog_from_memory.py
    /opt/essensys/blog-build/essensys-memory/content/blog
    /opt/essensys/repo/site/public/blog
  when: prepare_blog_from_memory | default(false) | bool

- name: Install npm dependencies
  command: npm install
  args:
    chdir: /opt/essensys/repo/site

- name: Build React frontend
  command: npm run build
  args:
    chdir: /opt/essensys/repo/site
  environment:
    VITE_NEW_RELIC_ENABLED: "{{ newrelic_support_browser_enabled | default(false) | bool | lower }}"
    VITE_NEW_RELIC_ACCOUNT_ID: "{{ newrelic_account_id | default('') }}"
    VITE_NEW_RELIC_APPLICATION_ID: "{{ newrelic_support_browser_application_id | default('') }}"
    VITE_NEW_RELIC_LICENSE_KEY: "{{ vault_newrelic_browser_license_key | default(vault_newrelic_license_key | default('')) }}"
    VITE_NEW_RELIC_AGENT_ID: "{{ newrelic_support_browser_agent_id | default('') }}"
    VITE_NEW_RELIC_TRUST_KEY: "{{ newrelic_support_browser_trust_key | default(newrelic_account_id | default('')) }}"
    VITE_NEW_RELIC_REGION: "{{ newrelic_region | default('EU') }}"

- name: Clear deployment directory
  file:
    path: /opt/essensys/frontend/dist
    state: absent

- name: Recreate deployment directory
  file:
    path: /opt/essensys/frontend/dist
    state: directory
    owner: essensys
    group: essensys
    mode: '0755'

- name: Install frontend artifacts
  copy:
    src: /opt/essensys/repo/site/dist/
    dest: /opt/essensys/frontend/dist/
    remote_src: yes
    owner: essensys
    group: essensys
    mode: '0755'

- name: Create maintenance assets directory
  file:
    path: /opt/essensys/maintenance/assets
    state: directory
    owner: essensys
    group: essensys
    mode: '0755'

- name: Deploy maintenance page
  copy:
    src: /opt/essensys/repo/maintenance/index.html
    dest: /opt/essensys/maintenance/index.html
    remote_src: yes
    owner: essensys
    group: essensys

- name: Deploy maintenance assets
  copy:
    src: /opt/essensys/repo/site/src/assets/fond-inprogress.png
    dest: /opt/essensys/maintenance/assets/fond-inprogress.png
    remote_src: yes
    owner: essensys
    group: essensys

- name: Install Nginx config
  copy:
    src: /opt/essensys/repo/essensys.nginx
    dest: /etc/nginx/sites-available/essensys
    remote_src: yes

- name: Enable Nginx site
  file:
    src: /etc/nginx/sites-available/essensys
    dest: /etc/nginx/sites-enabled/essensys
    state: link

- name: Reload Nginx
  service:
    name: nginx
    state: reloaded
