---
- name: Arreter le service systemd essensys-backend (gere par Docker Compose)
  service:
    name: essensys-backend
    state: stopped
    enabled: false
  failed_when: false

- name: Arreter les conteneurs Docker individuels (migration vers compose)
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop:
    - "{{ control_plane_name }}"
    - "{{ backend_container_name }}"
    - "{{ mcp_container_name }}"
    - "{{ nginx_container_name }}"
    - "{{ traefik_container_name }}"
    - "{{ redis_container_name }}"
    - "{{ mosquitto_container_name }}"
    - mosquitto
    - adguardhome
    - "{{ adguard_container_name }}"
    - "{{ openclaw_container_name }}"
  failed_when: false

- name: Creer le repertoire de configuration backend Docker
  file:
    path: "{{ config_dir }}/backend"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Supprimer config.yaml si c'est un repertoire (cree par Docker au premier demarrage)
  ansible.builtin.shell: |
    if [ -d "{{ config_dir }}/backend/config.yaml" ]; then
      rm -rf "{{ config_dir }}/backend/config.yaml"
    fi
  changed_when: false

- name: Deployer la configuration backend Docker (si absente)
  copy:
    dest: "{{ config_dir }}/backend/config.yaml"
    content: |
      server:
        port: {{ backend_port }}
        read_timeout: 10s
        write_timeout: 10s
        idle_timeout: 60s

      auth:
        enabled: false

      logging:
        level: info
        format: text

      redis:
        addr: "localhost:6379"
        password: ""
        db: 0

      unifi:
        enabled: {{ unifi_enabled | lower }}
        base_url: "{{ unifi_base_url }}"
        api_key: "{{ unifi_api_key }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
    force: false

- name: Forcer le port dans la configuration backend Docker
  lineinfile:
    path: "{{ config_dir }}/backend/config.yaml"
    regexp: '^\s*port:'
    line: '  port: {{ backend_port }}'
    insertafter: '^server:'

- name: Deployer le fichier docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ compose_file }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'

- name: Pull des images Docker
  command: docker compose -f {{ compose_file }} pull
  changed_when: true

- name: Lancer les services via Docker Compose
  command: docker compose -f {{ compose_file }} up -d --remove-orphans --force-recreate
  changed_when: true

- name: Attendre que Mosquitto soit pret
  wait_for:
    host: 127.0.0.1
    port: "{{ mosquitto_port }}"
    delay: 2
    timeout: 30

- name: Attendre que Redis soit pret
  wait_for:
    host: 127.0.0.1
    port: "{{ redis_port }}"
    delay: 2
    timeout: 30

- name: Attendre que le backend soit pret
  wait_for:
    host: 127.0.0.1
    port: "{{ backend_port }}"
    delay: 2
    timeout: 60

- name: Attendre que Nginx soit pret
  wait_for:
    host: "{{ gateway_eth1_ip | default('127.0.0.1') }}"
    port: 80
    delay: 2
    timeout: 30

- name: Attendre que AdGuard soit pret
  wait_for:
    host: "{{ gateway_eth0_ip | default('127.0.0.1') }}"
    port: "{{ adguard_web_port }}"
    delay: 2
    timeout: 30

- name: Configurer le rewrite DNS pour mon.essensys.fr
  uri:
    url: http://{{ gateway_eth0_ip | default('127.0.0.1') }}:{{ adguard_web_port }}/control/rewrite/add
    method: POST
    headers:
      Content-Type: application/json
    body_format: json
    body:
      domain: mon.essensys.fr
      answer: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
    status_code: [200, 201]
  ignore_errors: true

- name: Attendre que Prometheus soit pret
  wait_for:
    host: 127.0.0.1
    port: "{{ prometheus_port }}"
    delay: 2
    timeout: 30

- name: Attendre que OpenClaw soit pret
  wait_for:
    host: 127.0.0.1
    port: "{{ openclaw_port }}"
    delay: 5
    timeout: 120
  ignore_errors: true
  register: openclaw_wait_result

- name: Avertir si OpenClaw n'est pas pret
  debug:
    msg: "ATTENTION: OpenClaw n'a pas demarre sur le port {{ openclaw_port }}. Verifier les logs avec: docker logs {{ openclaw_container_name }}"
  when: openclaw_wait_result is failed

- name: Afficher le statut Docker Compose
  debug:
    msg: >
      Services deployes via Docker Compose ({{ compose_project_name }}).
      Fichier: {{ compose_file }}
      Control Plane: http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ control_plane_port }}
      Prometheus: http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ prometheus_port }}
      AdGuard: http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ adguard_web_port }}
      OpenClaw: http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ openclaw_port }}
