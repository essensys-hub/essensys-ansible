# Essensys V.1.5.2 — variables Ansible pour déploiement figé (2026-07-08)
# V.1.5.1 (framework de plugins + tuile Solaire) + fix fusion des séries
# dans le store plugin (le snapshot ne gardait que la dernière métrique).
# Usage:
#   ansible-playbook install.gateway.audit.yml -e @releases/V.1.5.2.yml --tags backend,frontend

essensys_release_id: V.1.5.2
essensys_release_date: "2026-07-08"

# --- CM5 gateway + Raspberry classique ---
# essensys_version pilote les images Docker (inchangées) ; le code backend et
# frontend est construit depuis les tags git.
essensys_version: V.1.3.0
control_plane_version: V.1.3.7
backend_version: V.1.5.2
frontend_version: V.1.5.1
backend_plugin_repos_version: V.1.5.2

# --- OVH cloud hub (git SHA pins, inchangés depuis V.1.5.0) ---
cloud_backend_version: "9525a01"
portal_frontend_version: "974298a"
cloud_backend_consolidated: true
cloud_backend_legacy_mode: false
cloud_backend_port: 8080
