backend_version: V.1.6.0
frontend_version: V.1.6.0
backend_plugin_repos_version: V.1.6.0

# --- OVH cloud hub (git SHA pins, inchangés depuis V.1.5.0) ---
cloud_backend_version: "9525a01"
portal_frontend_version: "974298a"
cloud_backend_consolidated: true
cloud_backend_legacy_mode: false
