# collecteur enrichi (grid_export_today, battery_charge_today).
# Usage:
#   ansible-playbook install.gateway.audit.yml -e @releases/V.1.6.0.yml --tags backend,frontend
#   ansible-playbook deploy-plugin-sungrow.yml -e @releases/V.1.6.0.yml

essensys_release_id: V.1.6.0
essensys_release_date: "2026-07-08"

# --- CM5 gateway + Raspberry classique ---
