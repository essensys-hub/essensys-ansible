<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#f5f6f8"/>
  <text x="30" y="44" font-size="26" font-weight="700" fill="#1d1d1f">Installer la CA sur iPhone / iPad (iOS · iPadOS)</text>
  <text x="30" y="72" font-size="15" fill="#6b7077">3 étapes — il faut télécharger le profil PUIS activer la confiance (étape souvent oubliée).</text>

  <!-- STEP 1 -->
  <g transform="translate(30,100)">
    <circle cx="18" cy="18" r="16" fill="#0a84ff"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#1d1d1f">Télécharger dans Safari</text>
    <!-- phone -->
    <g transform="translate(10,46)">
      <rect x="0" y="0" width="250" height="330" rx="30" fill="#fff" stroke="#d2d2d7" stroke-width="2"/>
      <rect x="20" y="26" width="210" height="34" rx="8" fill="#eceef1"/>
      <text x="34" y="48" font-size="12" fill="#3c3c43">🔒 mon.essensys.local</text>
      <text x="20" y="96" font-size="12.5" fill="#1d1d1f">Ouvrir l'URL :</text>
      <rect x="20" y="106" width="210" height="40" rx="8" fill="#f2f3f5" stroke="#d2d2d7"/>
      <text x="30" y="131" font-size="11.5" fill="#0a84ff">…/essensys-local-ca.crt</text>
      <rect x="45" y="186" width="160" height="100" rx="14" fill="#f2f3f5" stroke="#d2d2d7"/>
      <text x="125" y="220" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Profil téléchargé</text>
      <text x="125" y="242" font-size="10.5" fill="#6b7077" text-anchor="middle">Vérifiez-le dans Réglages</text>
      <rect x="65" y="256" width="120" height="22" rx="11" fill="#0a84ff"/>
      <text x="125" y="271" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Autoriser</text>
    </g>
  </g>

  <!-- arrow -->
  <text x="300" y="290" font-size="30" fill="#0a84ff">→</text>

  <!-- STEP 2 -->
  <g transform="translate(345,100)">
    <circle cx="18" cy="18" r="16" fill="#0a84ff"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#1d1d1f">Installer le profil</text>
    <g transform="translate(10,46)">
      <rect x="0" y="0" width="250" height="330" rx="30" fill="#fff" stroke="#d2d2d7" stroke-width="2"/>
      <text x="20" y="34" font-size="12" fill="#6b7077">Réglages › Général ›</text>
      <text x="20" y="52" font-size="12" fill="#6b7077">VPN et gestion de l'appareil</text>
      <rect x="20" y="66" width="210" height="58" rx="10" fill="#f2f3f5" stroke="#d2d2d7"/>
      <text x="34" y="90" font-size="13" font-weight="600" fill="#1d1d1f">Essensys Local CA</text>
      <text x="34" y="110" font-size="11" fill="#6b7077">Profil non vérifié</text>
      <rect x="55" y="150" width="140" height="40" rx="10" fill="#0a84ff"/>
      <text x="125" y="175" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Installer</text>
      <text x="125" y="225" font-size="11" fill="#6b7077" text-anchor="middle">(code de l'appareil</text>
      <text x="125" y="242" font-size="11" fill="#6b7077" text-anchor="middle">demandé)</text>
    </g>
  </g>

  <!-- arrow -->
  <text x="615" y="290" font-size="30" fill="#34c759">→</text>

  <!-- STEP 3 -->
  <g transform="translate(660,100)">
    <circle cx="18" cy="18" r="16" fill="#34c759"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#1d1d1f">Activer la confiance</text>
    <g transform="translate(10,46)">
      <rect x="0" y="0" width="250" height="330" rx="30" fill="#fff" stroke="#d2d2d7" stroke-width="2"/>
      <text x="20" y="32" font-size="10.5" fill="#6b7077">Réglages › Général › Infos ›</text>
      <text x="20" y="48" font-size="10.5" fill="#6b7077">Réglages des certificats de confiance</text>
      <rect x="20" y="66" width="210" height="50" rx="10" fill="#f2f3f5" stroke="#d2d2d7"/>
      <text x="34" y="88" font-size="12.5" font-weight="600" fill="#1d1d1f">Essensys Local CA</text>
      <text x="34" y="106" font-size="10.5" fill="#6b7077">Confiance totale du certificat</text>
      <!-- toggle ON -->
      <rect x="150" y="76" width="50" height="30" rx="15" fill="#34c759"/>
      <circle cx="185" cy="91" r="12" fill="#fff"/>
      <rect x="35" y="150" width="180" height="120" rx="12" fill="#eafaf0" stroke="#34c759"/>
      <text x="125" y="200" font-size="34" text-anchor="middle">🔒</text>
      <text x="125" y="232" font-size="12.5" font-weight="700" fill="#248a3d" text-anchor="middle">HTTPS de confiance</text>
      <text x="125" y="252" font-size="10.5" fill="#248a3d" text-anchor="middle">mon.essensys.local</text>
    </g>
  </g>
</svg>
