<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#f3f3f3"/>
  <text x="30" y="44" font-size="26" font-weight="700" fill="#202020">Installer la CA sur Windows</text>
  <text x="30" y="72" font-size="15" fill="#5a5a5a">Important : choisir « Ordinateur local » puis le magasin « Autorités de certification racines de confiance ».</text>

  <!-- STEP 1 -->
  <g transform="translate(30,100)">
    <circle cx="18" cy="18" r="16" fill="#0067c0"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#202020">Ouvrir le certificat</text>
    <g transform="translate(0,44)">
      <rect x="0" y="0" width="270" height="150" rx="8" fill="#fff" stroke="#cfcfcf"/>
      <rect x="0" y="0" width="270" height="30" rx="8" fill="#0067c0"/>
      <text x="14" y="20" font-size="12.5" font-weight="600" fill="#fff">essensys-local-ca.crt</text>
      <text x="135" y="62" font-size="34" text-anchor="middle">📄</text>
      <text x="135" y="92" font-size="12.5" fill="#202020" text-anchor="middle">Double-clic sur le fichier</text>
      <rect x="60" y="106" width="150" height="30" rx="4" fill="#0067c0"/>
      <text x="135" y="126" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Installer le certificat…</text>
    </g>
  </g>

  <text x="312" y="210" font-size="30" fill="#0067c0">→</text>

  <!-- STEP 2 -->
  <g transform="translate(355,100)">
    <circle cx="18" cy="18" r="16" fill="#0067c0"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#202020">Emplacement + magasin</text>
    <g transform="translate(0,44)">
      <rect x="0" y="0" width="290" height="200" rx="8" fill="#fff" stroke="#cfcfcf"/>
      <rect x="0" y="0" width="290" height="30" rx="8" fill="#0067c0"/>
      <text x="14" y="20" font-size="12.5" font-weight="600" fill="#fff">Assistant Importation</text>
      <circle cx="22" cy="56" r="6" fill="#fff" stroke="#0067c0" stroke-width="2"/>
      <text x="36" y="60" font-size="12" fill="#5a5a5a">Utilisateur actuel</text>
      <circle cx="22" cy="80" r="6" fill="#0067c0"/><circle cx="22" cy="80" r="2.5" fill="#fff"/>
      <text x="36" y="84" font-size="12.5" font-weight="700" fill="#202020">Ordinateur local</text>
      <line x1="14" y1="98" x2="276" y2="98" stroke="#e5e5e5"/>
      <text x="14" y="120" font-size="11.5" fill="#5a5a5a">Placer dans le magasin :</text>
      <rect x="14" y="130" width="262" height="34" rx="4" fill="#eef3fb" stroke="#0067c0"/>
      <text x="24" y="152" font-size="11.5" font-weight="700" fill="#0067c0">Autorités de certification racines de confiance</text>
    </g>
  </g>

  <text x="660" y="210" font-size="30" fill="#107c10">→</text>

  <!-- STEP 3 -->
  <g transform="translate(700,100)">
    <circle cx="18" cy="18" r="16" fill="#107c10"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#202020">Terminé</text>
    <g transform="translate(0,44)">
      <rect x="0" y="0" width="225" height="200" rx="8" fill="#eef7ee" stroke="#107c10"/>
      <text x="112" y="86" font-size="44" text-anchor="middle">🔒</text>
      <text x="112" y="120" font-size="13" font-weight="700" fill="#107c10" text-anchor="middle">HTTPS de confiance</text>
      <text x="112" y="142" font-size="11" fill="#107c10" text-anchor="middle">https://mon.essensys.local</text>
      <text x="112" y="172" font-size="10.5" fill="#5a5a5a" text-anchor="middle">Redémarrer le navigateur</text>
    </g>
  </g>

  <text x="30" y="470" font-size="13" fill="#5a5a5a">Alternative admin (PowerShell) :</text>
  <rect x="30" y="480" width="640" height="26" rx="4" fill="#1e1e1e"/>
  <text x="42" y="498" font-size="12" fill="#d4d4d4" font-family="Consolas, monospace">certutil -addstore -f Root essensys-local-ca.crt</text>
</svg>
