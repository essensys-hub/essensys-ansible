<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#f4f6f8"/>
  <text x="30" y="44" font-size="26" font-weight="700" fill="#202124">Installer la CA sur Android</text>
  <text x="30" y="72" font-size="15" fill="#5f6368">Les chemins varient selon la marque — cherchez « certificat CA » dans les Paramètres.</text>

  <!-- STEP 1 -->
  <g transform="translate(30,100)">
    <circle cx="18" cy="18" r="16" fill="#1a73e8"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#202124">Récupérer le fichier</text>
    <g transform="translate(10,46)">
      <rect x="0" y="0" width="250" height="330" rx="26" fill="#fff" stroke="#dadce0" stroke-width="2"/>
      <rect x="20" y="24" width="210" height="34" rx="17" fill="#eef0f3"/>
      <text x="34" y="46" font-size="11.5" fill="#3c4043">🔒 mon.essensys.local</text>
      <text x="20" y="92" font-size="12" fill="#202124">Télécharger :</text>
      <rect x="20" y="104" width="210" height="38" rx="8" fill="#f1f3f4" stroke="#dadce0"/>
      <text x="30" y="128" font-size="11" fill="#1a73e8">…/essensys-local-ca.crt</text>
      <rect x="45" y="190" width="160" height="96" rx="14" fill="#f1f3f4" stroke="#dadce0"/>
      <text x="125" y="226" font-size="30" text-anchor="middle">⬇️</text>
      <text x="125" y="256" font-size="11.5" fill="#5f6368" text-anchor="middle">Fichier enregistré</text>
      <text x="125" y="274" font-size="10.5" fill="#5f6368" text-anchor="middle">dans Téléchargements</text>
    </g>
  </g>

  <text x="300" y="290" font-size="30" fill="#1a73e8">→</text>

  <!-- STEP 2 -->
  <g transform="translate(345,100)">
    <circle cx="18" cy="18" r="16" fill="#1a73e8"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#202124">Paramètres › Sécurité</text>
    <g transform="translate(10,46)">
      <rect x="0" y="0" width="250" height="330" rx="26" fill="#fff" stroke="#dadce0" stroke-width="2"/>
      <text x="20" y="34" font-size="11" fill="#5f6368">Sécurité › Chiffrement et</text>
      <text x="20" y="50" font-size="11" fill="#5f6368">identifiants › Installer un certificat</text>
      <rect x="20" y="66" width="210" height="44" rx="10" fill="#f1f3f4" stroke="#dadce0"/>
      <text x="34" y="93" font-size="12.5" font-weight="600" fill="#202124">Certificat CA</text>
      <rect x="20" y="124" width="210" height="40" rx="10" fill="#fff4e5" stroke="#f29900"/>
      <text x="125" y="142" font-size="10" fill="#b06000" text-anchor="middle">⚠ Installer quand même</text>
      <text x="125" y="156" font-size="9" fill="#b06000" text-anchor="middle">(avertissement normal)</text>
      <rect x="45" y="186" width="160" height="50" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
      <text x="125" y="206" font-size="12" font-weight="600" fill="#1a73e8" text-anchor="middle">Essensys Local CA</text>
      <text x="125" y="224" font-size="10" fill="#5f6368" text-anchor="middle">Sélectionner le fichier</text>
    </g>
  </g>

  <text x="615" y="290" font-size="30" fill="#1e8e3e">→</text>

  <!-- STEP 3 -->
  <g transform="translate(660,100)">
    <circle cx="18" cy="18" r="16" fill="#1e8e3e"/><text x="18" y="24" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="48" y="24" font-size="17" font-weight="600" fill="#202124">Terminé</text>
    <g transform="translate(10,46)">
      <rect x="0" y="0" width="250" height="330" rx="26" fill="#fff" stroke="#dadce0" stroke-width="2"/>
      <rect x="35" y="70" width="180" height="160" rx="14" fill="#e6f4ea" stroke="#1e8e3e"/>
      <text x="125" y="140" font-size="44" text-anchor="middle">🔒</text>
      <text x="125" y="176" font-size="13" font-weight="700" fill="#1e8e3e" text-anchor="middle">HTTPS de confiance</text>
      <text x="125" y="198" font-size="10.5" fill="#1e8e3e" text-anchor="middle">mon.essensys.local</text>
      <text x="125" y="262" font-size="10" fill="#5f6368" text-anchor="middle">NB : Firefox Android utilise son</text>
      <text x="125" y="278" font-size="10" fill="#5f6368" text-anchor="middle">propre magasin de certificats</text>
    </g>
  </g>
</svg>
