---
# Deploy ciblé du collecteur Sungrow sur la CM5 (sans re-jouer tout le stack).
# Inventaire par défaut = inventory.gateway (CM5 distante).
#   Dry-run : ansible-playbook deploy-plugin-sungrow.yml --check --diff
#   Apply   : ansible-playbook deploy-plugin-sungrow.yml
- name: Deploy plugin collector — Sungrow
  hosts: raspberrypi
  gather_facts: true
  become: true
  vars:
    data_dir: /opt/data
  roles:
    - role: sops_load
      sops_load_cloud: true
      sops_load_gateway: false
      sops_required_cloud_keys:
        - winet_user
        - winet_pass
        - sungrow_mqtt_user
        - sungrow_mqtt_pass
    - raspberry_plugin_sungrow
