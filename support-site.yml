---
- name: Deploy Essensys Support Site
  hosts: essensys
  become: yes

  vars:
    use_cloud_backend: "{{ cloud_backend_consolidated | default(false) | bool and not cloud_backend_legacy_mode | default(false) | bool }}"

  # Tags allow publishing one site without running the whole stack. The frontend
  # role installs and reloads its own nginx vhost, so --tags frontend is enough
  # to serve a new build. sops_load is always because every role below reads the
  # decrypted secrets, notably VITE_TURNSTILE_SITE_KEY at Vite build time.
  roles:
    - role: sops_load
      sops_load_cloud: true
      sops_load_gateway: false
      tags: [always]
    - role: common
      tags: [common]
    - role: newrelic_infra
      tags: [newrelic]
    - role: database
      tags: [database]
    - role: cloud_backend
      when: use_cloud_backend | bool
      tags: [cloud_backend]
    - role: backend
      when: not (use_cloud_backend | bool)
      tags: [legacy_backend]
    - role: frontend
      tags: [frontend]
    - role: docs_site
      tags: [docs_site]
    - role: portal_backend
      when: not (use_cloud_backend | bool)
      tags: [portal_backend]
    - role: portal_frontend
      tags: [portal_frontend]
    - role: cloud_nginx
      when: use_cloud_backend | bool
      tags: [cloud_nginx]
    - role: portal_nginx
      when: not (use_cloud_backend | bool)
      tags: [portal_nginx]

- import_playbook: enable-https-prod.yml
