---
- name: Preparation NixOS Essensys Gateway CM5
  hosts: raspberrypi
  gather_facts: true
  become: true
  vars:
    confirm_cm5_nixos_prep: false
    service_user: essensys
    gateway_dual_nic: true
  pre_tasks:
    - name: Verifier confirmation preparation NixOS CM5
      ansible.builtin.assert:
        that:
          - confirm_cm5_nixos_prep | bool
        fail_msg: "Definissez confirm_cm5_nixos_prep=true pour preparer NixOS sur la CM5."
  roles:
    - raspberry_cm5_nixos
