name: CI

on:
  pull_request:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install ansible-core ansible-lint
      - name: Install collections
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml
          fi
      - run: ansible-lint

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install ansible-core
      - name: Install collections
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml
          fi
      - name: Syntax-check root playbooks
        run: |
          set -e
          for playbook in *.yml; do
            case "$playbook" in
              mkdocs.yml|requirements.yml) continue ;;
            esac
            echo "::group::$playbook"
            ansible-playbook -i inventory --syntax-check "$playbook"
            echo "::endgroup::"
          done
