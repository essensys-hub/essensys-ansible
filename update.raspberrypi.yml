---
- name: Mise a jour Essensys Raspberry Pi
  hosts: raspberrypi
  gather_facts: true
  become: true
  vars:
    service_user: essensys
    install_dir: /opt/essensys
    backend_dir: "{{ install_dir }}/backend"
    frontend_dir: "{{ install_dir }}/frontend"
    backend_repo: https://github.com/essensys-hub/essensys-server-backend.git
    frontend_repo: https://github.com/essensys-hub/essensys-server-frontend.git
    backend_version: V.1.2.2
    frontend_version: V.1.2.2
    acme_email: admin@acme.com
    use_staging: false
    wan_domain_default: essensys.acme.com
    domain_file: "/home/{{ service_user }}/domain.txt"
    traefik_version: v2.11.3
    go_version: "1.21.5"
    node_setup_script: "https://deb.nodesource.com/setup_20.x"
  roles:
    - raspberry_backend
    - raspberry_mcp
    - raspberry_frontend
    # Nginx pour port 80 (client legacy - tolérant aux requêtes HTTP non-standard)
    - raspberry_nginx
    # Traefik pour port 443 avec authentification
    - raspberry_traefik
    # Caddy désactivé (rejette les requêtes HTTP non-standard du client legacy)
    # - raspberry_caddy
    - raspberry_push_status
