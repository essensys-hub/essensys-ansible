---
- name: Mise a jour Essensys Raspberry Pi
  hosts: raspberrypi
  gather_facts: true
  become: true
  vars:
    service_user: essensys
    install_dir: /opt/essensys
    data_dir: /opt/data
    config_dir: "{{ data_dir }}/config"
    backend_dir: "{{ install_dir }}/backend"
    frontend_dir: "{{ install_dir }}/frontend"
    backend_repo: https://github.com/essensys-hub/essensys-server-backend.git
    frontend_repo: https://github.com/essensys-hub/essensys-server-frontend.git
    backend_version: V.1.3.0
    frontend_version: V.1.3.0
    essensys_version: V.1.3.0
    backend_use_host_binary: true
    backend_runtime: "compose"
    control_plane_version: V.1.3.7
    control_plane_port: 9100
    acme_email: admin@acme.com
    use_staging: false
    wan_domain_default: essensys.acme.com
    domain_file: "/home/{{ service_user }}/domain.txt"
    traefik_version: v2.11.3
    go_version: "1.26.0"
    node_setup_script: "https://deb.nodesource.com/setup_20.x"
    cloud_hub_public_url: "https://mon.essensys.fr"
    # Monitoring (templates nginx)
    prometheus_port: 9092
    alertmanager_port: 9093
    node_exporter_port: 9101
    avahi_hostname: mon.essensys
    avahi_domain: local

  pre_tasks:
    - name: Detecter l'adresse IP de eth0 (gateway_eth0_ip auto)
      ansible.builtin.shell: ip -4 addr show eth0 | awk '/inet / {print $2}' | cut -d/ -f1 | head -1
      register: eth0_ip_detected
      changed_when: false
      failed_when: false
      when: gateway_dual_nic | default(false) | bool

    - name: Definir gateway_eth0_ip depuis l'interface si non specifie
      ansible.builtin.set_fact:
        gateway_eth0_ip: "{{ eth0_ip_detected.stdout }}"
      when:
        - gateway_dual_nic | default(false) | bool
        - gateway_eth0_ip | default('') == ''
        - eth0_ip_detected.stdout | default('') != ''

    - name: Lire le domaine WAN
      ansible.builtin.slurp:
        src: "{{ domain_file }}"
      register: domain_file_content
      ignore_errors: true

    - name: Calculer wan_domain pour Traefik
      ansible.builtin.set_fact:
        wan_domain: >-
          {{
            (domain_file_content.content | default('') | b64decode | trim)
            if (domain_file_content is defined and domain_file_content.content is defined and (domain_file_content.content | b64decode | trim) != '')
            else wan_domain_default
          }}

    - name: Detect installed Go version
      ansible.builtin.command: /usr/local/go/bin/go version
      register: go_installed
      failed_when: false
      changed_when: false

    - name: Install or upgrade Go for backend V.1.3.0 (requires >= 1.25)
      ansible.builtin.shell: |
        set -euo pipefail
        wget -q "https://go.dev/dl/go{{ go_version }}.linux-arm64.tar.gz" -O /tmp/go.tar.gz
        rm -rf /usr/local/go
        tar -C /usr/local -xzf /tmp/go.tar.gz
        rm /tmp/go.tar.gz
        /usr/local/go/bin/go version
      when: >
        go_installed.rc != 0 or
        ('go version go' + go_version) not in go_installed.stdout

  roles:
    - role: raspberry_postgresql
      when: lan_iam_enabled | default(false) | bool
    - raspberry_backend
    - raspberry_mcp
    - raspberry_frontend
    # Nginx pour port 80 (client legacy - tolérant aux requêtes HTTP non-standard)
    - raspberry_nginx
    # Traefik pour port 443 avec authentification (stack WAN)
    - raspberry_traefik
    - role: raspberry_avahi
      when: gateway_dual_nic | default(false) | bool
    - raspberry_push_status

  post_tasks:
    - name: Desactiver le service systemd backend sur les gateways pilotees par Docker Compose
      ansible.builtin.service:
        name: essensys-backend
        state: stopped
        enabled: false
      failed_when: false

    - name: Verifier la presence du fichier docker-compose gateway
      ansible.builtin.stat:
        path: "{{ data_dir }}/docker-compose.yml"
      register: gateway_compose_file

    - name: Redemarrer le backend Docker Compose pour prendre en compte le binaire hote recompile
      ansible.builtin.command:
        cmd: docker compose -f {{ data_dir }}/docker-compose.yml up -d --force-recreate essensys-backend
      when: gateway_compose_file.stat.exists
      changed_when: true

    - name: Attendre que le backend Docker Compose redevienne joignable
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 7070
        delay: 2
        timeout: 60
      when: gateway_compose_file.stat.exists
