[defaults]
# Gateway CM5 par defaut ; VPS OVH : ansible-playbook -i inventory ...
inventory = inventory.gateway
host_key_checking = False
remote_user = essensys
private_key_file = ~/.ssh/id_ed25519

[ssh_connection]
ssh_args = -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
